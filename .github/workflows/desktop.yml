name: Desktop

# Builds Grab for Windows and macOS. Run it by hand to test, or publish a
# GitHub release and the packages are attached to it automatically.
on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag to attach the desktop builds to (e.g. v1.0.21)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Also attach the builds to this existing release (e.g. v1.0.0)"
        required: false
        default: ""
  pull_request:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath grab-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: grab-windows
          path: grab-windows-x64.zip
      - name: Attach to release
        if: github.event_name == 'release' || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name || inputs.tag }}" grab-windows-x64.zip --clobber

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # Some plugins need the newest macOS SDK; use the latest Xcode on the runner.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Package
        # Designed install window: Pop background, Grab and Applications side by side.
        run: macos/dmg/make_dmg.sh build/macos/Build/Products/Release/Grab.app grab-macos.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: grab-macos
          path: grab-macos.dmg
      - name: Attach to release
        if: github.event_name == 'release' || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name || inputs.tag }}" grab-macos.dmg --clobber

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev libsqlite3-dev \
            dpkg-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Scaffold Linux runner & build release
        run: |
          if [ ! -d linux ]; then
            flutter create --platforms=linux --project-name=grab --org=app.grab .
          fi
          sed -i 's/set(APPLICATION_ID ".*")/set(APPLICATION_ID "app.grab.grab.expressive")/' linux/CMakeLists.txt || true
          sed -i 's/"grab"/"Grab Expressive"/g' linux/runner/my_application.cc || true
          flutter pub get
          flutter build linux --release
      - name: Package .tar.gz, .deb, and AppImage
        run: |
          BUNDLE="build/linux/x64/release/bundle"
          TAG_RAW="${{ github.event.release.tag_name || inputs.tag }}"
          DEB_VER="${TAG_RAW#v}"
          if [ -z "$DEB_VER" ]; then DEB_VER="1.0.0"; fi

          # 1. Portable .tar.gz
          tar -czf grab-linux-x64.tar.gz -C "$BUNDLE" .

          # 2. Debian / Ubuntu .deb
          DEB_DIR="build/deb-pkg"
          rm -rf "$DEB_DIR"
          mkdir -p "$DEB_DIR/DEBIAN" \
                   "$DEB_DIR/opt/grab-expressive" \
                   "$DEB_DIR/usr/bin" \
                   "$DEB_DIR/usr/share/applications" \
                   "$DEB_DIR/usr/share/icons/hicolor/256x256/apps"
          cp -r "$BUNDLE"/* "$DEB_DIR/opt/grab-expressive/"
          ln -sf /opt/grab-expressive/grab "$DEB_DIR/usr/bin/grab-expressive"
          cp assets/brand/icon.png "$DEB_DIR/usr/share/icons/hicolor/256x256/apps/grab-expressive.png"
          cat > "$DEB_DIR/usr/share/applications/grab-expressive.desktop" << 'EOF'
          [Desktop Entry]
          Name=Grab Expressive
          Comment=Download video, audio and subtitles from 1,800+ sites
          Exec=/usr/bin/grab-expressive
          Icon=grab-expressive
          Terminal=false
          Type=Application
          Categories=AudioVideo;Network;Utility;
          EOF
          cat > "$DEB_DIR/DEBIAN/control" << EOF
          Package: grab-expressive
          Version: ${DEB_VER}
          Section: video
          Priority: optional
          Architecture: amd64
          Depends: libgtk-3-0, libsqlite3-0, xdg-utils
          Maintainer: Grab Expressive <https://github.com/Mhmdysry/grab>
          Description: Grab Expressive — Material 3 Expressive media downloader
           Download video, audio, and subtitles from YouTube, TikTok, Instagram,
           and 1,800+ sites powered by yt-dlp and FFmpeg.
          EOF
          dpkg-deb --build "$DEB_DIR" grab-linux-x64.deb

          # 3. Portable AppImage (FUSE-free extraction on CI)
          APPDIR="build/GrabExpressive.AppDir"
          rm -rf "$APPDIR"
          mkdir -p "$APPDIR/usr/bin" \
                   "$APPDIR/usr/share/applications" \
                   "$APPDIR/usr/share/icons/hicolor/256x256/apps"
          cp -r "$BUNDLE"/* "$APPDIR/usr/bin/"
          cp assets/brand/icon.png "$APPDIR/grab-expressive.png"
          cp assets/brand/icon.png "$APPDIR/usr/share/icons/hicolor/256x256/apps/grab-expressive.png"
          cat > "$APPDIR/grab-expressive.desktop" << 'EOF'
          [Desktop Entry]
          Name=Grab Expressive
          Comment=Download video, audio and subtitles from 1,800+ sites
          Exec=grab
          Icon=grab-expressive
          Terminal=false
          Type=Application
          Categories=AudioVideo;Network;Utility;
          EOF
          cp "$APPDIR/grab-expressive.desktop" "$APPDIR/usr/share/applications/grab-expressive.desktop"
          cat > "$APPDIR/AppRun" << 'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          export LD_LIBRARY_PATH="$HERE/usr/bin/lib:${LD_LIBRARY_PATH}"
          exec "$HERE/usr/bin/grab" "$@"
          EOF
          chmod +x "$APPDIR/AppRun"
          curl -fSL -o appimagetool.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage
          ARCH=x86_64 ./appimagetool.AppImage --appimage-extract-and-run "$APPDIR" grab-linux-x64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: grab-linux
          path: |
            grab-linux-x64.tar.gz
            grab-linux-x64.deb
            grab-linux-x64.AppImage
      - name: Attach to release
        if: github.event_name == 'release' || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name || inputs.tag }}" \
            grab-linux-x64.tar.gz \
            grab-linux-x64.deb \
            grab-linux-x64.AppImage \
            --clobber
