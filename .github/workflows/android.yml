name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build release APKs (split per ABI)
        run: >-
          flutter build apk --release --split-per-abi
          --build-name=1.0.${{ github.run_number }}
          --build-number=${{ github.run_number }}
          --android-skip-build-dependency-validation

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: grab-expressive-arm64-v8a
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 14

      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@v4
        with:
          name: grab-expressive-armeabi-v7a
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          retention-days: 14

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: grab-expressive-x86_64
          path: build/app/outputs/flutter-apk/app-x86_64-release.apk
          retention-days: 14

      - name: Publish GitHub Release for in-app updates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "grab-expressive-${TAG}-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "grab-expressive-${TAG}-armeabi-v7a.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk "grab-expressive-${TAG}-x86_64.apk"
          python3 - "$TAG" << 'PY' > release_notes.md
          import subprocess, sys
          from pathlib import Path
          tag = sys.argv[1]
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8") if Path("CHANGELOG.md").exists() else ""
          section = ""
          for header in (f"## [{tag}]", "## [Latest]"):
              idx = changelog.find(header)
              if idx != -1:
                  rest = changelog[idx:]
                  end = rest.find("\n---\n")
                  section = (rest[:end] if end != -1 else rest).strip()
                  break
          if section:
              print(section)
              print("\n---\n")
          try:
              commits = subprocess.check_output(
                  ["git", "log", "-n", "8", "--pretty=format:- `%h` %s"],
                  text=True,
              ).strip()
              if commits:
                  print("### Recent Commits\n" + commits)
          except Exception:
              pass
          PY
          gh release delete "$TAG" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$TAG" \
            "grab-expressive-${TAG}-arm64-v8a.apk" \
            "grab-expressive-${TAG}-armeabi-v7a.apk" \
            "grab-expressive-${TAG}-x86_64.apk" \
            --title "Grab Expressive ${TAG}" \
            --notes-file release_notes.md
