name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build release APKs (split per ABI)
        run: flutter build apk --release --split-per-abi --android-skip-build-dependency-validation

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: grab-expressive-arm64-v8a
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 14

      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@v4
        with:
          name: grab-expressive-armeabi-v7a
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          retention-days: 14

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: grab-expressive-x86_64
          path: build/app/outputs/flutter-apk/app-x86_64-release.apk
          retention-days: 14
